name: Frontend CI/CD + Preview

on:
  pull_request:
    branches: [prod]
  push:
    branches: [prod]

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------
  # 1) PR 미리보기 (GitHub Pages)
  # -------------------------
  preview:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
      pull-requests: write
    # ✅ 공통 환경변수(시크릿) — 이 job 전체에서 사용 가능
    env:
      VITE_KAKAO_API:           ${{ secrets.VITE_KAKAO_API }}
      VITE_EMAILJS_SERVICE_ID:  ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
      VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
      VITE_EMAILJS_PUBLIC_KEY:  ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
      VITE_EMAILJS_TO_EMAIL:    ${{ secrets.VITE_EMAILJS_TO_EMAIL }}
      VITE_API_BASE_URL:        ${{ secrets.VITE_API_BASE_URL }}
      VITE_JWT_SECRET:          ${{ secrets.VITE_JWT_SECRET }}

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - uses: actions/setup-node@v4
        with:
          node-version: 20          # ★ Node 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci --no-audit --progress=false || npm i --no-audit --progress=false

      # .env 생성 (VITE_*만 클라이언트 노출)
      - name: Create .env (for preview)
        run: |
          {
            echo "VITE_KAKAO_API=$VITE_KAKAO_API"
            echo "VITE_EMAILJS_SERVICE_ID=$VITE_EMAILJS_SERVICE_ID"
            echo "VITE_EMAILJS_TEMPLATE_ID=$VITE_EMAILJS_TEMPLATE_ID"
            echo "VITE_EMAILJS_PUBLIC_KEY=$VITE_EMAILJS_PUBLIC_KEY"
            echo "VITE_EMAILJS_TO_EMAIL=$VITE_EMAILJS_TO_EMAIL"
            echo "VITE_API_BASE_URL=$VITE_API_BASE_URL"
            echo "VITE_JWT_SECRET=$VITE_JWT_SECRET"
          } >> .env

      - name: Build preview
        env:
          NODE_ENV: production
          PREVIEW: 'true'
          PR_NUMBER: ${{ github.event.number }}
        run: npm run build

      - name: SPA 404 fallback
        run: cp dist/index.html dist/404.html || true

      - name: Add .nojekyll
        run: echo > dist/.nojekyll

      - name: Publish to gh-pages/pr-<num>
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: dist
          destination_dir: pr-${{ github.event.number }}
          keep_files: true

      - name: Start deployment
        id: start_deploy
        uses: bobheadxi/deployments@v1
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: preview/pr-${{ github.event.number }}
          ref: ${{ github.head_ref || github.ref }}
          transient: true
          auto_inactive: true

      - name: Finish deployment (success)
        if: success()
        uses: bobheadxi/deployments@v1
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          deployment_id: ${{ steps.start_deploy.outputs.deployment_id }}
          env: preview/pr-${{ github.event.number }}
          status: success
          env_url: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${{ github.event.number }}/

      - name: Finish deployment (failure)
        if: failure()
        uses: bobheadxi/deployments@v1
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          deployment_id: ${{ steps.start_deploy.outputs.deployment_id }}
          env: preview/pr-${{ github.event.number }}
          status: failure

      - name: Comment preview URL
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const url = `https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${{ github.event.number }}/`
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🔍 **Preview ready:** [${url}](${url})`
            })

  # -------------------------
  # 2) prod push: 빌드 → 아티팩트 업로드
  # -------------------------
  package:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/prod' }}
    name: Package – Build artifact (prod)
    runs-on: ubuntu-latest
    env:   # ✅ 공통 시크릿 한 번에
      VITE_KAKAO_API:           ${{ secrets.VITE_KAKAO_API }}
      VITE_EMAILJS_SERVICE_ID:  ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
      VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
      VITE_EMAILJS_PUBLIC_KEY:  ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
      VITE_EMAILJS_TO_EMAIL:    ${{ secrets.VITE_EMAILJS_TO_EMAIL }}
      VITE_API_BASE_URL:        ${{ secrets.VITE_API_BASE_URL }}
      VITE_JWT_SECRET:          ${{ secrets.VITE_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install deps
        run: npm ci --no-audit --progress=false || npm i --no-audit --progress=false

      - name: Create .env (prod)
        run: |
          {
            echo "VITE_KAKAO_API=$VITE_KAKAO_API"
            echo "VITE_EMAILJS_SERVICE_ID=$VITE_EMAILJS_SERVICE_ID"
            echo "VITE_EMAILJS_TEMPLATE_ID=$VITE_EMAILJS_TEMPLATE_ID"
            echo "VITE_EMAILJS_PUBLIC_KEY=$VITE_EMAILJS_PUBLIC_KEY"
            echo "VITE_EMAILJS_TO_EMAIL=$VITE_EMAILJS_TO_EMAIL"
            echo "VITE_API_BASE_URL=$VITE_API_BASE_URL"
            echo "VITE_JWT_SECRET=$VITE_JWT_SECRET"
          } >> .env

      - name: Build (prod artifact)
        env:
          DEPLOY_TARGET: nginx     # ★ Nginx 배포 → Vite base '/'
          NODE_ENV: production
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 3

  # -------------------------
  # 3) prod push: 아티팩트 내려받아 서버 배포(Nginx)
  # -------------------------
  deploy:
    needs: package
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/prod' }}
    name: CD – Deploy from artifact
    runs-on: ubuntu-latest
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist

      - name: Deploy to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dist/*"
          target: "/var/www/hwajeon_main_page"
          strip_components: 1
