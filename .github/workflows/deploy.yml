name: Frontend CI/CD + Preview

on:
  pull_request:
    branches: [prod]     # PR → Preview
  push:
    branches: [prod]     # prod push → 패키징 + 배포

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

# --- 1) PR 미리보기 (GitHub Pages) ---
jobs:
  preview:
    if: ${{ github.event_name == 'pull_request' }}
    name: Preview – PR build & deploy to Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write       # gh-pages 브랜치 푸시
      deployments: write    # Deployments 박스
      pull-requests: write  # PR 코멘트(선택)

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build preview
        run: npm run build

      # SPA 404 fallback (React Router 새로고침 404 방지)
      - name: SPA 404 fallback
        run: cp dist/index.html dist/404.html

      # gh-pages/pr-<PR번호>/ 에 업로드
      - name: Publish to gh-pages/pr-<num>
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: dist
          destination_dir: pr-${{ github.event.number }}

      - name: Set preview URL
        id: url
        run: echo "url=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${{ github.event.number }}/" >> $GITHUB_OUTPUT

      # Deployments 박스에 링크 노출
      - name: Create deployment
        uses: bobheadxi/deployments@v1
        id: deploy
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: preview/pr-${{ github.event.number }}
          ref: ${{ github.head_ref }}
          transient: true
          auto_inactive: true

      - name: Finish deployment
        if: success()
        uses: bobheadxi/deployments@v1
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          env: ${{ steps.deploy.outputs.env }}
          status: success
          env_url: ${{ steps.url.outputs.url }}

      # PR 코멘트로도 링크 달기(선택)
      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${{ steps.url.outputs.url }}`
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🔍 **Preview ready:** ${url}`
            })

  # --- 2) prod push: 빌드 → 아티팩트 업로드 ---
  package:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/prod' }}
    name: Package – Build artifact (prod)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Create .env
        run: |
          echo "VITE_KAKAO_API=${{ secrets.VITE_KAKAO_API }}" >> .env
          echo "VITE_EMAILJS_SERVICE_ID=${{ secrets.VITE_EMAILJS_SERVICE_ID }}" >> .env
          echo "VITE_EMAILJS_TEMPLATE_ID=${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}" >> .env
          echo "VITE_EMAILJS_PUBLIC_KEY=${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}" >> .env
          echo "VITE_EMAILJS_TO_EMAIL=${{ secrets.VITE_EMAILJS_TO_EMAIL }}" >> .env
          echo "VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}" >> .env
          echo "VITE_JWT_SECRET=${{ secrets.VITE_JWT_SECRET }}" >> .env

      - name: Build (prod artifact)
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 3

  # --- 3) prod push: 아티팩트 내려받아 서버 배포 ---
  deploy:
    needs: package
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/prod' }}
    name: CD – Deploy from artifact
    runs-on: ubuntu-latest
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist

      - name: Deploy to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dist/*"
          target: "/var/www/hwajeon_main_page"
          strip_components: 1
