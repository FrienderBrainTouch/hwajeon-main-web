name: Frontend CI/CD + Preview

on:
  pull_request:
    branches: [prod]      # PR → Preview
  push:
    branches: [prod]      # prod push → 패키징 + 배포(Nginx)

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------
  # 1) PR 미리보기 (GitHub Pages)
  # -------------------------
  preview:
    if: ${{ github.event_name == 'pull_request' }}
    name: Preview – PR build & deploy to Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install deps
        run: npm ci || npm i

      - name: Build preview
        run: npm run build

      - name: SPA 404 fallback
        run: cp dist/index.html dist/404.html || true

      - name: Publish to gh-pages/pr-<num>
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: dist
          destination_dir: pr-${{ github.event.number }}

      - name: Set preview URL
        id: url
        run: echo "url=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${{ github.event.number }}/" >> $GITHUB_OUTPUT

      # ✅ start: env 필수
      - name: Start deployment
        id: start_deploy
        uses: bobheadxi/deployments@v1
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: preview/pr-${{ github.event.number }}   # << 여기!
          ref: ${{ github.head_ref || github.ref }}
          transient: true
          auto_inactive: true

      # ✅ finish: deployment_id + env 둘 다 넘겨주기
      - name: Finish deployment (success)
        if: success()
        uses: bobheadxi/deployments@v1
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          deployment_id: ${{ steps.start_deploy.outputs.deployment_id }}
          env: preview/pr-${{ github.event.number }}   # << 여기!
          status: success
          env_url: ${{ steps.url.outputs.url }}

      - name: Finish deployment (failure)
        if: failure()
        uses: bobheadxi/deployments@v1
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          deployment_id: ${{ steps.start_deploy.outputs.deployment_id }}
          env: preview/pr-${{ github.event.number }}
          status: failure

  # -------------------------
  # 2) prod push: 빌드 → 아티팩트 업로드
  # -------------------------
  package:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/prod' }}
    name: Package – Build artifact (prod)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install deps
        run: npm ci || npm i

      - name: Create .env (prod)
        run: |
          echo "VITE_KAKAO_API=${{ secrets.VITE_KAKAO_API }}" >> .env
          echo "VITE_EMAILJS_SERVICE_ID=${{ secrets.VITE_EMAILJS_SERVICE_ID }}" >> .env
          echo "VITE_EMAILJS_TEMPLATE_ID=${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}" >> .env
          echo "VITE_EMAILJS_PUBLIC_KEY=${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}" >> .env
          echo "VITE_EMAILJS_TO_EMAIL=${{ secrets.VITE_EMAILJS_TO_EMAIL }}" >> .env
          echo "VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}" >> .env
          echo "VITE_JWT_SECRET=${{ secrets.VITE_JWT_SECRET }}" >> .env

      - name: Build (prod artifact)
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 3

  # -------------------------
  # 3) prod push: 아티팩트 내려받아 서버 배포(Nginx)
  # -------------------------
  deploy:
    needs: package
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/prod' }}
    name: CD – Deploy from artifact
    runs-on: ubuntu-latest
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist

      - name: Deploy to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dist/*"
          target: "/var/www/hwajeon_main_page"
          strip_components: 1
